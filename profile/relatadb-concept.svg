  <!-- Section label -->
  <g style="animation:fadeIn 0.6s ease 1.8s both;opacity:0">
    <text x="640" y="78" text-anchor="middle" fill="#64748b" font-size="9" letter-spacing="2" font-weight="600">KNOWLEDGE GRAPH — LIVE INVESTIGATION</text>
  </g>

