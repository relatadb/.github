    <text x="289" y="230" text-anchor="middle" fill="#818cf8" font-size="6.5">bi-temporal</text>
    <rect x="311" y="222" width="30" height="11" rx="3" fill="#1e1b4b"/>
    <text x="326" y="230" text-anchor="middle" fill="#818cf8" font-size="6.5">governed</text>
  </g>

  <!-- Arrow core → graph -->
