  <!-- Node: Omar Al-Rashid (suspect hub) -->
  <g style="animation:popIn 0.5s ease 2.0s both;opacity:0">
    <circle cx="560" cy="170" r="22" fill="url(#rg2)" style="animation:glow 2s ease-in-out 2.5s infinite"/>
    <circle cx="560" cy="170" r="18" fill="#2d0f0f" stroke="#ef4444" stroke-width="2"/>
    <text x="560" y="167" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="700">SUSPECT</text>
    <text x="560" y="179" text-anchor="middle" fill="#ef4444" font-size="8">Omar A.</text>
    <!-- pulse rings -->
    <circle cx="560" cy="170" r="22" fill="none" stroke="#ef4444" stroke-width="1.5" style="animation:pulse 1.8s ease-in-out 2.5s infinite"/>
  </g>

  <!-- Node: Shell Co Dubai -->
  <g style="animation:popIn 0.5s ease 2.2s both;opacity:0">
    <circle cx="490" cy="280" r="15" fill="#1a1508" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="490" y="277" text-anchor="middle" fill="#fde047" font-size="7.5" font-weight="600">Shell Co</text>
    <text x="490" y="287" text-anchor="middle" fill="#fef08a" font-size="7">Dubai</text>
  </g>

  <!-- Node: Viktor (associate) -->
  <g style="animation:popIn 0.5s ease 2.35s both;opacity:0">
    <circle cx="650" cy="150" r="14" fill="#0f1a28" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="650" y="147" text-anchor="middle" fill="#93c5fd" font-size="7.5" font-weight="600">Viktor K.</text>
    <text x="650" y="157" text-anchor="middle" fill="#60a5fa" font-size="7">Moscow</text>
