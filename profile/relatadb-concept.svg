    <circle cx="680" cy="250" r="14" fill="#0a1f10" stroke="#22c55e" stroke-width="1.5"/>
    <text x="680" y="247" text-anchor="middle" fill="#86efac" font-size="7.5" font-weight="600">CH-4471</text>
    <text x="680" y="257" text-anchor="middle" fill="#4ade80" font-size="7">$4.2M</text>
  </g>

  <!-- Node: Border crossing -->
  <g style="animation:popIn 0.5s ease 2.65s both;opacity:0">
    <circle cx="590" cy="330" r="13" fill="#0a1c22" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="590" y="327" text-anchor="middle" fill="#67e8f9" font-size="7.5" font-weight="600">Border</text>
    <text x="590" y="337" text-anchor="middle" fill="#22d3ee" font-size="7">UAE→TR</text>
