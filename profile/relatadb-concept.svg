    <rect x="420" y="390" width="360" height="58" rx="8" fill="#0f0a1f" stroke="#7c3aed" stroke-width="1" opacity="0.95"/>
    <circle cx="439" cy="407" r="8" fill="#ef4444" style="animation:glow 1.5s ease-in-out 4s infinite"/>
    <text x="452" y="411" fill="#ef4444" font-size="10" font-weight="700">ALERT TRIGGERED</text>
    <text x="420" y="427" fill="#94a3b8" font-size="8.5" xml:space="preserve">  Omar A. → Shell Co Dubai → CH-4471 → OFAC Sanctions list</text>
    <text x="420" y="442" fill="#64748b" font-size="8" xml:space="preserve">  Cross-border + $4.2M wire + sanctions match · found in 3ms across 6 datasets</text>
  </g>

  <!-- ── TEMPORAL QUERY PILL ── -->
  <g style="animation:tagSlide 0.7s ease 4.4s both;opacity:0">
    <rect x="420" y="360" width="280" height="20" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="432" y="374" fill="#475569" font-size="8">SELECT * FROM</text>
    <text x="500" y="374" fill="#7c3aed" font-size="8" font-weight="600">Transaction</text>
    <text x="553" y="374" fill="#475569" font-size="8">AS OF</text>
