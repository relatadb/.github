<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; }

      @keyframes fadeIn    { from { opacity:0 } to { opacity:1 } }
      @keyframes slideUp   { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
      @keyframes popIn     { 0%{opacity:0;transform:scale(0.3)} 60%{transform:scale(1.1)} 100%{opacity:1;transform:scale(1)} }
      @keyframes drawLine  { from{stroke-dashoffset:300;opacity:0} to{stroke-dashoffset:0;opacity:1} }
      @keyframes flowDot   { 0%{offset-distance:0%;opacity:0} 15%{opacity:1} 85%{opacity:1} 100%{offset-distance:100%;opacity:0} }
      @keyframes pulse     { 0%,100%{transform:scale(1);opacity:0.6} 50%{transform:scale(1.4);opacity:0.2} }
      @keyframes glow      { 0%,100%{filter:drop-shadow(0 0 4px #ef4444)} 50%{filter:drop-shadow(0 0 14px #ef4444)} }
      @keyframes blink     { 0%,100%{opacity:1} 50%{opacity:0.3} }
      @keyframes shimmer   { 0%,100%{opacity:0.5} 50%{opacity:1} }
      @keyframes tagSlide  { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
    </style>
    <filter id="gb"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gr"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3z" fill="#7c3aed" opacity="0.8"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3z" fill="#ef4444"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="100%" stop-color="#0b1022"/>
    </linearGradient>
    <radialGradient id="rg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" fill="url(#bg)" rx="14"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="0.7" fill="#ffffff" opacity="0.07"/>
  </pattern>
  <rect width="860" height="480" fill="url(#dots)" rx="14"/>

  <!-- ── HEADER ── -->
  <g style="animation:slideUp 0.6s ease 0.1s both;opacity:0">
    <text x="430" y="32" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600" letter-spacing="3" opacity="0.5">RELATA DB · SOVEREIGN INTELLIGENCE DATABASE</text>
    <text x="430" y="56" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="700">Connect any dataset. Query any moment. See what others miss.</text>
  </g>

  <!-- ══════════ LEFT PANEL — DATA SOURCES ══════════ -->

  <g style="animation:slideUp 0.5s ease 0.4s both;opacity:0">
    <text x="80" y="90" text-anchor="middle" fill="#64748b" font-size="9" letter-spacing="2" font-weight="600">DATA SOURCES</text>
  </g>

  <!-- Source cards -->
  <!-- People -->
  <g style="animation:slideUp 0.5s ease 0.5s both;opacity:0">
    <rect x="18" y="100" width="124" height="34" rx="7" fill="#0f1e38" stroke="#1d4ed8" stroke-width="1" opacity="0.9"/>
    <text x="30" y="118" fill="#93c5fd" font-size="11">👤</text>
    <text x="46" y="114" fill="#bfdbfe" font-size="10" font-weight="600">People</text>
    <text x="46" y="126" fill="#64748b" font-size="8">Passports · IDs · KYC</text>
  </g>

  <!-- Finance -->
  <g style="animation:slideUp 0.5s ease 0.65s both;opacity:0">
    <rect x="18" y="144" width="124" height="34" rx="7" fill="#0f2213" stroke="#16a34a" stroke-width="1" opacity="0.9"/>
    <text x="30" y="162" fill="#86efac" font-size="11">💳</text>
    <text x="46" y="158" fill="#bbf7d0" font-size="10" font-weight="600">Transactions</text>
    <text x="46" y="170" fill="#64748b" font-size="8">SWIFT · IBAN · Crypto</text>
  </g>

  <!-- Comms -->
  <g style="animation:slideUp 0.5s ease 0.8s both;opacity:0">
    <rect x="18" y="188" width="124" height="34" rx="7" fill="#1c1028" stroke="#9333ea" stroke-width="1" opacity="0.9"/>
    <text x="30" y="206" fill="#d8b4fe" font-size="11">📱</text>
    <text x="46" y="202" fill="#e9d5ff" font-size="10" font-weight="600">Communications</text>
    <text x="46" y="214" fill="#64748b" font-size="8">CDRs · Metadata</text>
  </g>

  <!-- Location -->
  <g style="animation:slideUp 0.5s ease 0.95s both;opacity:0">
    <rect x="18" y="232" width="124" height="34" rx="7" fill="#0e1f28" stroke="#0891b2" stroke-width="1" opacity="0.9"/>
    <text x="30" y="250" fill="#67e8f9" font-size="11">🌍</text>
    <text x="46" y="246" fill="#a5f3fc" font-size="10" font-weight="600">Locations</text>
    <text x="46" y="258" fill="#64748b" font-size="8">CCTV · Border · GPS</text>
  </g>

  <!-- News -->
  <g style="animation:slideUp 0.5s ease 1.1s both;opacity:0">
    <rect x="18" y="276" width="124" height="34" rx="7" fill="#201818" stroke="#dc2626" stroke-width="1" opacity="0.9"/>
    <text x="30" y="294" fill="#fca5a5" font-size="11">📰</text>
    <text x="46" y="290" fill="#fecaca" font-size="10" font-weight="600">Open Source</text>
    <text x="46" y="302" fill="#64748b" font-size="8">News · Sanctions · OSINT</text>
  </g>

  <!-- Corporate -->
  <g style="animation:slideUp 0.5s ease 1.25s both;opacity:0">
    <rect x="18" y="320" width="124" height="34" rx="7" fill="#1a1a0e" stroke="#ca8a04" stroke-width="1" opacity="0.9"/>
    <text x="30" y="338" fill="#fde047" font-size="11">🏢</text>
    <text x="46" y="334" fill="#fef08a" font-size="10" font-weight="600">Corporate</text>
    <text x="46" y="346" fill="#64748b" font-size="8">Ownership · Directors</text>
  </g>

  <!-- Flow lines + animated dots -->
  <path d="M142,117 C200,117 230,210 295,210" fill="none" stroke="#1d4ed8" stroke-width="1" opacity="0.2"/>
  <path d="M142,161 C210,161 240,210 295,210" fill="none" stroke="#16a34a" stroke-width="1" opacity="0.2"/>
  <path d="M142,205 C230,205 260,210 295,210" fill="none" stroke="#9333ea" stroke-width="1" opacity="0.2"/>
  <path d="M142,249 C210,249 240,210 295,210" fill="none" stroke="#0891b2" stroke-width="1" opacity="0.2"/>
  <path d="M142,293 C200,293 230,210 295,210" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.2"/>
  <path d="M142,337 C190,337 230,210 295,210" fill="none" stroke="#ca8a04" stroke-width="1" opacity="0.2"/>

  <circle r="3.5" fill="#93c5fd" style="offset-path:path('M142,117 C200,117 230,210 295,210');animation:flowDot 2.8s ease-in-out 0.2s infinite"/>
  <circle r="3.5" fill="#86efac" style="offset-path:path('M142,161 C210,161 240,210 295,210');animation:flowDot 2.8s ease-in-out 0.7s infinite"/>
  <circle r="3.5" fill="#d8b4fe" style="offset-path:path('M142,205 C230,205 260,210 295,210');animation:flowDot 2.8s ease-in-out 1.2s infinite"/>
  <circle r="3.5" fill="#67e8f9" style="offset-path:path('M142,249 C210,249 240,210 295,210');animation:flowDot 2.8s ease-in-out 1.7s infinite"/>
  <circle r="3.5" fill="#fca5a5" style="offset-path:path('M142,293 C200,293 230,210 295,210');animation:flowDot 2.8s ease-in-out 2.2s infinite"/>
  <circle r="3.5" fill="#fde047" style="offset-path:path('M142,337 C190,337 230,210 295,210');animation:flowDot 2.8s ease-in-out 2.7s infinite"/>

  <!-- ══════════ CENTER — RELATA CORE ══════════ -->

  <!-- Glow backdrop -->
  <circle cx="310" cy="210" r="80" fill="url(#rg1)" style="animation:shimmer 3s ease-in-out infinite"/>

  <!-- Core rings -->
  <circle cx="310" cy="210" r="60" fill="none" stroke="#7c3aed" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.3" style="animation:shimmer 5s linear infinite"/>
