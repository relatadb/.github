    <circle cx="460" cy="170" r="12" fill="#180f28" stroke="#a855f7" stroke-width="1.5"/>
    <text x="460" y="167" text-anchor="middle" fill="#d8b4fe" font-size="7.5" font-weight="600">CDR</text>
    <text x="460" y="177" text-anchor="middle" fill="#c084fc" font-size="7">+971-XX</text>
  </g>

  <!-- ── EDGES ── -->
  <g style="animation:drawLine 0.8s ease 2.1s both;opacity:0;stroke-dasharray:300">
    <!-- Omar → Shell Co -->
    <line x1="546" y1="186" x2="500" y2="267" stroke="#ca8a04" stroke-width="1.5" opacity="0.8"/>
    <!-- Omar → Viktor -->
    <line x1="578" y1="160" x2="636" y2="155" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    <!-- Viktor → Account -->
    <line x1="662" y1="162" x2="672" y2="237" stroke="#22c55e" stroke-width="1.5" opacity="0.8"/>
    <!-- Shell Co → Account -->
    <line x1="504" y1="271" x2="667" y2="253" stroke="#22c55e" stroke-width="1.5" opacity="0.7"/>
    <!-- Omar → Border -->
    <line x1="552" y1="188" x2="586" y2="318" stroke="#06b6d4" stroke-width="1.5" opacity="0.8"/>
    <!-- Account → Sanctions -->
    <line x1="694" y1="261" x2="714" y2="318" stroke="#ef4444" stroke-width="2" opacity="0.9" marker-end="url(#arr-red)"/>
    <!-- Phone → Omar -->
    <line x1="472" y1="170" x2="541" y2="170" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
    <!-- Border → Sanctions -->
    <line x1="602" y1="335" x2="707" y2="335" stroke="#f87171" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- ── EDGE LABELS ── -->
  <g style="animation:fadeIn 0.8s ease 3.2s both;opacity:0">
    <rect x="501" y="219" width="50" height="12" rx="3" fill="#0d0f1a" opacity="0.85"/>
    <text x="526" y="228" text-anchor="middle" fill="#ca8a04" font-size="7">OWNS →</text>

    <rect x="596" y="150" width="48" height="12" rx="3" fill="#0d0f1a" opacity="0.85"/>
    <text x="620" y="159" text-anchor="middle" fill="#60a5fa" font-size="7">CALLED →</text>

    <rect x="568" y="258" width="56" height="12" rx="3" fill="#0d0f1a" opacity="0.85"/>
    <text x="596" y="267" text-anchor="middle" fill="#22c55e" font-size="7">SENDS $$ →</text>

    <rect x="690" y="282" width="42" height="12" rx="3" fill="#200a0a" opacity="0.9"/>
    <text x="711" y="291" text-anchor="middle" fill="#ef4444" font-size="7" font-weight="600">⚠ MATCH</text>
