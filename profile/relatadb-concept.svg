    <rect x="20"  y="390" width="80"  height="18" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="60"  y="402" text-anchor="middle" fill="#4ade80" font-size="8">✓ Bi-temporal</text>

    <rect x="108" y="390" width="70"  height="18" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="143" y="402" text-anchor="middle" fill="#a78bfa" font-size="8">✓ Governed</text>

    <rect x="186" y="390" width="80"  height="18" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="226" y="402" text-anchor="middle" fill="#38bdf8" font-size="8">✓ Self-hosted</text>

    <rect x="274" y="390" width="90"  height="18" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="319" y="402" text-anchor="middle" fill="#fb923c" font-size="8">✓ Any protocol</text>

    <rect x="20"  y="416" width="100" height="18" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="70"  y="428" text-anchor="middle" fill="#f472b6" font-size="8">✓ Full audit trail</text>

    <rect x="128" y="416" width="100" height="18" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="178" y="428" text-anchor="middle" fill="#facc15" font-size="8">✓ 6 query languages</text>

    <rect x="236" y="416" width="130" height="18" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
